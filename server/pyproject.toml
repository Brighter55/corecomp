# Ruff config for the CoreComp backend.
#
# Deliberately narrow. The baseline is measured before rules are added, and
# families are widened one at a time as the existing findings are paid down --
# enabling everything at once turns the gate red for reasons unrelated to any
# real change, which is how a team learns to ignore its linter.
#
# Also note: this is a linter, not a formatter. `ruff format` is not adopted
# here, so run it with care if you ever do -- it would rewrite the whole tree.

[tool.ruff]
target-version = "py311"
line-length = 100

# Migrations are generated by Django and reviewed by nobody; linting them adds
# noise without catching anything a human would have written.
exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E9 = syntax errors (a real gate: the file won't even parse)
# F  = pyflakes: undefined names, unused imports, redefinitions -- real bugs
# I  = import sorting: mechanical, zero judgement calls, keeps diffs quiet
select = ["E9", "F", "I"]

# No per-file-ignores. The baseline was measured clean without them (all three
# unused imports ruff found were in accounts/admin.py, pages/admin.py and
# accounts/models.py), so suppressing anything here would hide real findings
# rather than silence known-benign ones.
