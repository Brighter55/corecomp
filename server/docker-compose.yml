# Local development only — Redis runs in Docker (no official native Windows
# build). Postgres runs natively on your machine (Windows service
# postgresql-x64-17, localhost:5432). Django runs on your machine:
#     cd server && pipenv run python corecomp/manage.py runserver
#
# Production runs on Render with no Docker at all — see render.yaml at the repo root.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - corecomp_redisdata:/data

volumes:
  corecomp_redisdata:
