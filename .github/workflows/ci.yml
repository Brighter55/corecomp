name: CI

# Both triggers are deliberate. `push` covers direct and merged pushes to
# master; `pull_request` is left unpinned so PRs opened against any base branch
# are still checked. A workflow whose trigger matches neither never runs at all
# -- and a green checkmark means nothing if the workflow never started.
on:
  push:
    branches: [master]
  pull_request: {}

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corecomp
        ports:
          - 5432:5432
        # Without the health check the job can start before Postgres accepts
        # connections, and check.py then reports INCOMPLETE.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # server/.env is gitignored, so on a runner there is NO env file: these
      # plus check.py's own defaults are the only source of configuration.
      CORECOMP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corecomp
      CORECOMP_TEST_REDIS_URL: redis://localhost:6379/1
      # 32+ bytes: PyJWT warns (InsecureKeyLengthWarning) for shorter HS256 keys.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-padded-to-32b
      # Use the setup-python interpreter directly; pipenv is never installed here.
      CORECOMP_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          # requirements.txt is the pinned production export and deliberately
          # excludes the linter.
          pip install ruff

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      # The ONLY verification step. Every gate lives in scripts/check.py, and
      # this deliberately does not repeat any of them: duplicated commands drift,
      # and the moment a gate is added to the script CI would silently stop
      # checking it. Green locally must mean green here.
      - name: Verify
        run: python scripts/check.py

  # Split from `verify` on purpose: browser tests are the slowest and flakiest
  # gate, so a flake can be re-run from the Actions UI on its own instead of
  # forcing the whole unit suite to run again.
  e2e:
    name: e2e (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corecomp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CORECOMP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/corecomp
      # DB 2, the harness's own namespace, so its flushdb() cannot disturb
      # anything else and nothing else can disturb it.
      CORECOMP_E2E_REDIS_URL: redis://localhost:6379/2
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-padded-to-32b
      CORECOMP_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Resolve the Playwright version (browser cache key)
        id: pw
        working-directory: client
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      # A cache hit brings the binary back but not the runner's shared
      # libraries, so the apt half still has to run.
      - name: Install OS deps for the cached Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium

      # Headless only -- a runner has no display, and --headed would need xvfb.
      # Locally, use `npm run e2e:headed` or `npm run e2e:ui`.
      - name: Verify (browser)
        run: python scripts/check.py --e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
