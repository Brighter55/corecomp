# Render blueprint — CoreComp
# Services: API (Django), Frontend (static), Redis, PostgreSQL
#
# All env vars with `sync: false` are set in the Render dashboard
# (Dashboard -> your service -> Environment). Values never live in this file.
#
# Removed from the old setup: STRIPE_API_KEY, STRIPE_ENDPOINT_SECRET,
# MAILGUN_API_KEY (subscriptions and email auth are gone).

services:
  - type: web
    name: corecomp-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: cd corecomp && gunicorn corecomp.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: WISESHEETS_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MOCK
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DEBUG
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      - key: AUTH_COOKIE_SECURE
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        sync: false
      # Postgres connection string injected automatically from the
      # corecomp-postgres service. settings.py parses it with dj-database-url
      # (internal URL, includes sslmode=require) — nothing to set in the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: corecomp-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CSRF_COOKIE_SAMESITE
        sync: false
      - key: CSRF_COOKIE_SECURE
        sync: false
      - key: CSRF_COOKIE_DOMAIN
        sync: false
      # Redis connection string injected automatically from the corecomp-redis
      # Key-Value service. Used by Django as the cache, the distributed lock,
      # and the anonymous usage quota.
      - key: REDIS_CACHE_LOCATION
        fromService:
          name: corecomp-redis
          property: connectionString

  - type: web
    name: corecomp-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_LOGO_DEV_PUBLISHABLE_KEY
        sync: false

  # Render Key-Value store (managed Redis) — used by Django as the cache,
  # the distributed lock, and the anonymous usage quota.
  - type: keyvalue
    name: corecomp-redis
    plan: free

  - type: postgresql
    name: corecomp-postgres
    plan: free
    databaseName: corecomp
    user: corecomp
